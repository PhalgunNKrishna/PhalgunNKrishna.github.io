<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- rounded square background in deep teal -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#06181D"/>
  <!-- subtle aqua ring -->
  <rect x="4" y="4" width="92" height="92" rx="19" fill="none" stroke="#35E0C8" stroke-width="2" opacity="0.5"/>
  <!-- PK monogram -->
  <text x="50" y="52" text-anchor="middle" dominant-baseline="central"
        font-family="'Space Grotesk','Arial Black',sans-serif"
        font-size="46" font-weight="700" fill="#35E0C8" letter-spacing="-2">PK</text>
</svg>
